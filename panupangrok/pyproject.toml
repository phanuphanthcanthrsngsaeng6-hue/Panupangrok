[build-system]
requires = ["setuptools>=45.0"]
build-backend = "setuptools.build_meta"
[project]
name = "panupangrok"
version = "0.1.0"
description = "PanupanGrok curated AI agent runtime"
requires-python = ">=3.10"
dependencies = ["click>=8.0", "requests>=2.28.2", "fastapi>=0.115.0", "pydantic>=2.7.0,<3", "httpx>=0.27.0"]
[project.scripts]
panupangrok = "cli.cli:main"
[tool.setuptools.packages.find]
include = ["agent*", "bridge*", "channel*", "cli*", "common*", "expert_system*", "models*", "plugins*", "scheduler*", "tasks_api*", "translate*", "voice*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
